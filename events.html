<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Events & Schedule | IMOLE 2027</title>

    <meta name="description"
          content="Upcoming meetings, ward activities, stakeholder engagements, community visits and campaign events of Hon. Nurudeen Abayomi Sadeeq and the IMOLE 2027 movement in Ojo Constituency II.">

    <meta name="keywords"
          content="IMOLE 2027, Nurudeen Abayomi Sadeeq, Ojo Constituency II, NDC, Lagos Assembly, campaign events, ward meetings">

    <meta name="theme-color"
          content="#ffffff">

    <meta property="og:title"
          content="Events & Schedule | IMOLE 2027">

    <meta property="og:description"
          content="Official IMOLE 2027 campaign events, meetings, ward activities and stakeholder engagements.">

    <meta property="og:type"
          content="website">

    <link rel="stylesheet"
          href="assets/css/style.css">

    <link rel="manifest"
          href="manifest.json">


<style>

/* =====================================================
   EVENTS PAGE
===================================================== */

.events-page {

    max-width: 1150px;

    margin: auto;

    padding: 35px 15px 70px;

}


/* =====================================================
   PAGE HEADER
===================================================== */

.events-header {

    text-align: center;

    margin-bottom: 35px;

}

.events-header h1 {

    font-size: 38px;

    margin: 10px 0;

}

.events-header p {

    max-width: 800px;

    margin: auto;

    line-height: 1.8;

}


/* =====================================================
   EVENT COUNTDOWN
===================================================== */

.next-event-box {

    background: #ffffff;

    padding: 28px 20px;

    border-radius: 20px;

    text-align: center;

    margin-bottom: 35px;

    box-shadow:
        0 6px 22px rgba(0,0,0,0.12);

}

.next-event-box h2 {

    margin: 5px 0 10px;

}

.next-event-title {

    font-size: 20px;

    font-weight: bold;

    margin: 10px 0;

}

.event-countdown {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    max-width: 600px;

    margin: 22px auto 0;

}

.countdown-unit {

    background: #f5f5f5;

    border-radius: 12px;

    padding: 15px 8px;

}

.countdown-unit strong {

    display: block;

    font-size: 27px;

    margin-bottom: 4px;

}


/* =====================================================
   QUICK INFORMATION
===================================================== */

.event-intro {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 18px;

    margin-bottom: 45px;

}

.intro-card {

    background: #ffffff;

    padding: 22px;

    text-align: center;

    border-radius: 16px;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.10);

}

.intro-card .icon {

    font-size: 32px;

    margin-bottom: 8px;

}

.intro-card h3 {

    margin: 8px 0;

}

.intro-card p {

    line-height: 1.6;

    margin: 0;

}


/* =====================================================
   SEARCH AND FILTER
===================================================== */

.event-tools {

    background: #ffffff;

    padding: 20px;

    border-radius: 16px;

    margin-bottom: 35px;

    box-shadow:
        0 4px 16px rgba(0,0,0,0.10);

}

.event-search {

    width: 100%;

    box-sizing: border-box;

    padding: 13px 15px;

    border: 1px solid #ddd;

    border-radius: 9px;

    font-size: 16px;

    outline: none;

}

.event-search:focus {

    border-color: #777;

}

.filter-buttons {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-top: 15px;

}

.filter-button {

    border: none;

    padding: 10px 16px;

    border-radius: 20px;

    cursor: pointer;

    font-weight: bold;

    background: #eeeeee;

}

.filter-button.active {

    background: #222222;

    color: #ffffff;

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title {

    text-align: center;

    margin: 45px 0 25px;

}

.section-title h2 {

    font-size: 29px;

    margin-bottom: 8px;

}

.section-title p {

    line-height: 1.6;

}


/* =====================================================
   EVENT GRID
===================================================== */

.event-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(290px, 1fr));

    gap: 22px;

}


/* =====================================================
   EVENT CARD
===================================================== */

.event-card {

    background: #ffffff;

    padding: 25px;

    border-radius: 18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.11);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;

}

.event-card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 9px 25px rgba(0,0,0,0.16);

}

.event-card.hidden {

    display: none;

}

.event-status {

    display: inline-block;

    padding: 7px 12px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

    margin-bottom: 12px;

    background: #eeeeee;

}

.event-card h2 {

    margin: 8px 0 18px;

    font-size: 22px;

    line-height: 1.35;

}

.event-detail {

    margin: 11px 0;

    line-height: 1.65;

}

.event-description {

    margin-top: 16px;

    line-height: 1.75;

}


/* =====================================================
   EVENT ACTIONS
===================================================== */

.event-actions {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 18px;

}

.event-button,
.whatsapp-button,
.calendar-button {

    display: inline-block;

    padding: 11px 16px;

    border-radius: 8px;

    text-decoration: none;

    font-weight: bold;

    border: none;

    cursor: pointer;

    font-size: 14px;

}

.event-button {

    background: #eeeeee;

    color: inherit;

}

.whatsapp-button {

    background: #eeeeee;

    color: inherit;

}

.calendar-button {

    background: #eeeeee;

    color: inherit;

}


/* =====================================================
   NO RESULTS
===================================================== */

.no-results {

    display: none;

    text-align: center;

    padding: 30px 15px;

    background: #ffffff;

    border-radius: 15px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.08);

}

.no-results.show {

    display: block;

}


/* =====================================================
   PAST EVENTS
===================================================== */

.past-events {

    opacity: 0.90;

}


/* =====================================================
   NOTICE
===================================================== */

.notice-box {

    margin-top: 45px;

    padding: 28px 22px;

    border-radius: 18px;

    background: #f5f5f5;

    text-align: center;

    line-height: 1.8;

}


/* =====================================================
   JOIN CTA
===================================================== */

.join-box {

    margin-top: 40px;

    padding: 35px 20px;

    text-align: center;

    border-radius: 18px;

    background: #ffffff;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.10);

}

.join-box p {

    max-width: 700px;

    margin: 10px auto 20px;

    line-height: 1.7;

}

.join-button {

    display: inline-block;

    padding: 14px 24px;

    border-radius: 8px;

    text-decoration: none;

    font-weight: bold;

}

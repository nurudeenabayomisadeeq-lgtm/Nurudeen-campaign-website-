<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Movement | Hon. Nurudeen Abayomi Sadeeq</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header>
    <section class="join-page">

<h1>Join the Movement</h1>

<p>
Be part of the movement to build a better Ojo Constituency II. Together, we can make a difference.
</p>

<form class="join-form">

<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>

<label>Phone Number</label>
<input type="tel" placeholder="Enter your phone number" required>

<label>Email Address</label>
<input type="email" placeholder="Enter your email">

<label>Ward</label>
<select required>
<option>Select your Ward</option>
<option>Ward D - Ijanikin</option>
<option>Ward F - Ilogbo</option>
<option>Ward G - Irewe</option>
<option>Ward I - Etegbin</option>
<option>Ward J - Idoluwo</option>
</select>

<label>How would you like to help?</label>
<select required>
<option>Select an option</option>
<option>Volunteer</option>
<option>Grassroots Mobilisation</option>
<option>Media Team</option>
<option>Youth Mobilisation</option>
<option>Women's Mobilisation</option>
<option>Logistics</option>
<option>Election Day Support</option>
</select>

<label>Message</label>
<textarea rows="5" placeholder="Tell us how you would like to support the campaign"></textarea>

<button type="submit">Join the Movement</button>

</form>

</section>

<footer>
    <p>&copy; 2026 Hon. Nurudeen Abayomi Sadeeq Campaign. All Rights Reserved.</p>
    <p>National Democratic Congress (NDC) | Ojo Constituency II</p>
</footer>

</body>
</html>

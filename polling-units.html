/* =========================================================
   IMOLE 2027 — POLLING UNIT DIRECTORY
   VERSION: 2026.08.31
========================================================= */

:root{
    --green:#075c32;
    --dark:#043d21;
    --deep:#061b10;
    --gold:#d7a63a;
    --gold-light:#f7e6b2;

    --white:#ffffff;
    --black:#111111;

    --text:#24332b;
    --muted:#68766e;

    --bg:#f4f8f5;
    --light:#edf8f2;
    --border:#dce8e0;

    --danger:#b42318;
    --warning:#8a6500;

    --shadow:
        0 12px 35px rgba(0,0,0,.08);

    --shadow-small:
        0 5px 18px rgba(0,0,0,.07);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:var(--bg);
    color:var(--text);

    line-height:1.6;

    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

img{
    max-width:100%;
    display:block;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    background:var(--dark);
    color:#fff;

    text-align:center;

    padding:
        8px
        15px;

    font-size:11px;
    font-weight:800;

    letter-spacing:.5px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;

    z-index:1000;

    background:
        rgba(255,255,255,.98);

    backdrop-filter:
        blur(12px);

    border-bottom:
        1px solid var(--border);

    box-shadow:
        0 3px 20px rgba(0,0,0,.06);
}

.nav-container{
    width:min(1200px,94%);

    min-height:72px;

    margin:auto;

    display:flex;

    align-items:center;

    gap:15px;
}

.logo-link{
    display:flex;

    align-items:center;

    gap:10px;

    min-width:245px;
}

.logo{
    width:48px;
    height:48px;

    object-fit:contain;

    border-radius:50%;

    border:
        2px solid var(--gold);

    background:#fff;
}

.brand{
    display:flex;
    flex-direction:column;
}

.brand strong{
    color:var(--green);

    font-size:18px;

    line-height:1.1;
}

.brand small{
    color:var(--muted);

    font-size:9px;

    font-weight:800;

    margin-top:4px;
}

.desktop-nav{
    margin-left:auto;

    display:flex;

    align-items:center;

    gap:2px;
}

.desktop-nav a{
    padding:
        9px 8px;

    border-radius:8px;

    font-size:11px;

    font-weight:800;

    white-space:nowrap;
}

.desktop-nav a:hover{
    background:var(--light);

    color:var(--green);
}

.desktop-nav .active{
    background:var(--green);

    color:#fff;
}

.join-link{
    background:var(--green);

    color:#fff!important;
}

.donation-link{
    background:#fff7df;

    color:#705000!important;

    border:
        1px solid #ead08b;
}

.menu-btn{
    display:none;

    margin-left:auto;

    width:44px;
    height:44px;

    border:0;

    border-radius:9px;

    background:var(--green);

    color:#fff;

    font-size:23px;
}

.mobile-nav{
    display:none;

    background:#fff;

    border-top:
        1px solid var(--border);

    padding:
        7px 4%;
}

.mobile-nav.open{
    display:flex;

    flex-direction:column;
}

.mobile-nav a{
    padding:13px 10px;

    border-bottom:
        1px solid var(--border);

    font-weight:800;
}

.mobile-nav a:last-child{
    border-bottom:0;
}

.mobile-nav .active{
    color:var(--green);

    background:var(--light);

    border-radius:8px;
}


/* =========================================================
   HERO
========================================================= */

.page-hero{
    position:relative;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 85% 15%,
            rgba(215,166,58,.18),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            var(--dark),
            var(--green)
        );

    color:#fff;
}

.page-hero::after{
    content:"";

    position:absolute;

    width:280px;
    height:280px;

    right:-100px;
    bottom:-150px;

    border-radius:50%;

    border:
        35px solid rgba(255,255,255,.05);
}

.hero-inner{
    width:min(1150px,94%);

    margin:auto;

    padding:
        65px 0
        60px;

    text-align:center;

    position:relative;

    z-index:2;
}

.hero-badge{
    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:
        8px 15px;

    border:
        1px solid rgba(255,255,255,.3);

    border-radius:30px;

    background:
        rgba(255,255,255,.08);

    font-size:11px;

    font-weight:800;

    margin-bottom:16px;
}

.hero-inner h1{
    font-size:
        clamp(34px,6vw,58px);

    line-height:1.05;

    margin-bottom:12px;
}

.hero-inner h1 span{
    color:var(--gold-light);
}

.hero-inner p{
    max-width:750px;

    margin:
        0 auto;

    color:
        rgba(255,255,255,.84);

    font-size:
        clamp(14px,2vw,17px);
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.page{
    width:min(1150px,94%);

    margin:auto;

    padding:
        50px 0
        80px;
}


/* =========================================================
   SUMMARY CARDS
========================================================= */

.summary-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    margin-bottom:30px;
}

.summary-card{
    background:#fff;

    border:
        1px solid var(--border);

    border-radius:17px;

    padding:
        23px 15px;

    text-align:center;

    box-shadow:var(--shadow-small);

    position:relative;

    overflow:hidden;
}

.summary-card::before{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:4px;

    background:var(--green);
}

.summary-card:nth-child(2)::before{
    background:var(--gold);
}

.summary-card:nth-child(3)::before{
    background:#4b8f69;
}

.summary-card:nth-child(4)::before{
    background:#8c7334;
}

.summary-icon{
    font-size:25px;

    margin-bottom:5px;
}

.summary-card strong{
    display:block;

    color:var(--dark);

    font-size:32px;

    line-height:1.1;

    margin-bottom:4px;
}

.summary-card span{
    color:var(--muted);

    font-size:11px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.5px;
}


/* =========================================================
   SEARCH PANEL
========================================================= */

.search-panel{
    background:#fff;

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:24px;

    margin-bottom:30px;

    box-shadow:var(--shadow);
}

.search-heading{
    margin-bottom:17px;
}

.search-heading h2{
    color:var(--dark);

    font-size:23px;

    margin-bottom:4px;
}

.search-heading p{
    color:var(--muted);

    font-size:13px;
}

.search-controls{
    display:grid;

    grid-template-columns:
        1fr 220px;

    gap:12px;
}

.search-box{
    position:relative;
}

.search-box span{
    position:absolute;

    left:15px;
    top:50%;

    transform:
        translateY(-50%);

    font-size:18px;

    pointer-events:none;
}

.search-input{
    width:100%;

    min-height:52px;

    padding:
        13px
        15px
        13px
        45px;

    border:
        1px solid #cfdcd4;

    border-radius:11px;

    outline:none;

    background:#fbfdfc;

    color:var(--text);

    font-size:15px;

    transition:.2s;
}

.search-input:focus{
    border-color:var(--green);

    box-shadow:
        0 0 0 3px
        rgba(7,92,50,.08);

    background:#fff;
}

.ward-select{
    width:100%;

    min-height:52px;

    padding:
        13px;

    border:
        1px solid #cfdcd4;

    border-radius:11px;

    outline:none;

    background:#fbfdfc;

    color:var(--text);

    font-size:14px;

    font-weight:700;
}

.ward-select:focus{
    border-color:var(--green);
}

.search-status{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-top:14px;

    padding-top:14px;

    border-top:
        1px solid var(--border);

    color:var(--muted);

    font-size:12px;
}

.clear-btn{
    border:0;

    background:var(--light);

    color:var(--green);

    padding:
        7px 12px;

    border-radius:7px;

    font-weight:800;

    font-size:12px;
}

.clear-btn:hover{
    background:#dff1e7;
}


/* =========================================================
   WARD QUICK FILTER
========================================================= */

.quick-wards{
    margin-bottom:35px;
}

.quick-wards h2{
    text-align:center;

    color:var(--dark);

    font-size:25px;

    margin-bottom:5px;
}

.quick-wards > p{
    text-align:center;

    color:var(--muted);

    font-size:13px;

    margin-bottom:18px;
}

.ward-buttons{
    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:9px;
}

.ward-filter{
    border:
        1px solid var(--border);

    background:#fff;

    color:var(--text);

    padding:
        10px 15px;

    border-radius:25px;

    font-size:12px;

    font-weight:800;

    transition:.2s;
}

.ward-filter:hover{
    transform:
        translateY(-2px);

    border-color:var(--green);

    color:var(--green);
}

.ward-filter.active{
    background:var(--green);

    color:#fff;

    border-color:var(--green);

    box-shadow:
        0 5px 15px
        rgba(7,92,50,.2);
}


/* =========================================================
   DIRECTORY HEADING
========================================================= */

.directory-heading{
    display:flex;

    justify-content:space-between;

    align-items:end;

    gap:20px;

    margin:
        20px 0
        20px;
}

.directory-heading h2{
    color:var(--dark);

    font-size:30px;
}

.directory-heading p{
    color:var(--muted);

    font-size:13px;
}

.result-count{
    flex-shrink:0;

    padding:
        9px 13px;

    border-radius:9px;

    background:var(--light);

    color:var(--green);

    font-size:12px;

    font-weight:800;
}


/* =========================================================
   WARD CARDS
========================================================= */

.ward-list{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:22px;
}

.ward-card{
    background:#fff;

    border:
        1px solid var(--border);

    border-radius:20px;

    overflow:hidden;

    box-shadow:var(--shadow-small);

    transition:.2s;
}

.ward-card:hover{
    box-shadow:var(--shadow);

    transform:
        translateY(-2px);
}

.ward-card.hidden{
    display:none;
}

.ward-header{
    background:
        linear-gradient(
            135deg,
            var(--dark),
            var(--green)
        );

    color:#fff;

    padding:
        21px 20px;

    position:relative;
}

.ward-label{
    color:var(--gold-light);

    font-size:11px;

    font-weight:900;

    letter-spacing:1px;
}

.ward-header h3{
    font-size:24px;

    margin:
        2px 0
        3px;
}

.ward-header p{
    color:
        rgba(255,255,255,.75);

    font-size:12px;
}

.ward-total{
    position:absolute;

    top:20px;
    right:18px;

    padding:
        7px 10px;

    border-radius:8px;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.18);

    font-size:11px;

    font-weight:800;
}


/* =========================================================
   POLLING UNIT LIST
========================================================= */

.polling-unit-list{
    padding:14px;
}

.polling-unit{
    display:grid;

    grid-template-columns:
        105px 1fr;

    gap:12px;

    padding:
        14px 10px;

    border-bottom:
        1px solid #edf1ee;

    transition:.15s;
}

.polling-unit:last-child{
    border-bottom:0;
}

.polling-unit:hover{
    background:#f8fbf9;

    border-radius:9px;
}

.polling-unit.hidden{
    display:none;
}

.pu-number{
    color:var(--green);

    font-size:12px;

    font-weight:900;

    word-break:break-word;
}

.pu-location{
    color:var(--text);

    font-size:12px;

    line-height:1.55;

    font-weight:700;
}

.pu-status{
    display:inline-block;

    margin-top:6px;

    padding:
        3px 7px;

    border-radius:10px;

    font-size:8px;

    font-weight:900;

    letter-spacing:.3px;
}

.pu-status.existing{
    background:#e8f5ed;

    color:#17653c;
}

.pu-status.new{
    background:#fff3d6;

    color:#765600;
}


/* =========================================================
   NO RESULTS
========================================================= */

.no-results{
    display:none;

    padding:
        45px 20px;

    margin-top:20px;

    text-align:center;

    background:#fff;

    border:
        1px solid var(--border);

    border-radius:17px;

    box-shadow:var(--shadow-small);
}

.no-results.show{
    display:block;
}

.no-results-icon{
    font-size:42px;

    margin-bottom:8px;
}

.no-results h3{
    color:var(--dark);

    margin-bottom:5px;
}

.no-results p{
    color:var(--muted);

    font-size:13px;
}


/* =========================================================
   INFORMATION BOX
========================================================= */

.info-box{
    margin-top:35px;

    padding:
        24px;

    border-radius:17px;

    background:
        #fff8e5;

    border:
        1px solid #ecd99e;

    color:#634f12;
}

.info-box h3{
    margin-bottom:7px;

    font-size:17px;
}

.info-box p{
    font-size:12px;

    line-height:1.7;
}


/* =========================================================
   CTA
========================================================= */

.cta{
    margin-top:35px;

    padding:
        40px 25px;

    text-align:center;

    border-radius:21px;

    background:
        linear-gradient(
            135deg,
            var(--green),
            var(--dark)
        );

    color:#fff;
}

.cta h2{
    font-size:
        clamp(26px,4vw,38px);

    margin-bottom:7px;
}

    max-width:650px;

    margin:
        0 auto
        20px;

    color:
        rgba(255,255,255,.8);

    font-size:13px;
}

.cta-buttons{
    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:10px;
}

.btn{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-height:45px;

    padding:
        11px 18px;

    border-radius:9px;

    font-size:12px;

    font-weight:900;

    transition:.2s;
}

.btn:hover{
    transform:
        translateY(-2px);
}

.btn-white{
    background:#fff;

    color:var(--green);
}

.btn-gold{
    background:var(--gold);

    color:#182016;
}

.btn-outline{
    border:
        1px solid
        rgba(255,255,255,.4);

    background:
        rgba(255,255,255,.06);

    color:#fff;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
    background:var(--deep);

    color:#fff;
}

.footer-inner{
    width:min(1150px,94%);

    margin:auto;

    padding:
        45px 0
        30px;

    display:grid;

    grid-template-columns:
        2fr 1fr 1fr;

    gap:35px;
}

.footer-brand{
    display:flex;

    align-items:center;

    gap:11px;
}

.footer-logo{

    object-fit:contain;

        2px solid var(--gold);

}

.footer-brand strong{
    display:block;

}

.footer-brand small{
    display:block;

    color:#9fb1a7;

    font-size:8px;

    margin-top:2px;
}

.footer-column p{
    color:#aebfb4;

    font-size:12px;

    line-height:1.7;

    margin-top:13px;
}

.footer-column h3{
    margin-bottom:12px;

    font-size:15px;

.footer-column a{

    color:#c6d1ca;

    margin:7px 0;
}

.footer-column a:hover{
    color:#fff;
}

.footer-bottom{
    border-top:
        1px solid
        rgba(255,255,255,.1);

    padding:
        18px 15px;

    text-align:center;

    color:#899d92;

    font-size:10px;

    line-height:1.7;
}


/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp{
    position:fixed;

    right:18px;
    bottom:20px;

    z-index:1200;

    width:55px;
    height:55px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#25d366;

    color:#fff;

    font-size:25px;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.25);

    transition:.2s;
}

.whatsapp:hover{
    transform:
        scale(1.08);
}


/* =========================================================
   BACK TO TOP
========================================================= */

.back-top{
    position:fixed;

    right:20px;
    bottom:88px;

    z-index:1190;

    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    background:var(--green);

    color:#fff;

    font-size:20px;

    opacity:0;

    pointer-events:none;

    transition:.2s;

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.2);
}

.back-top.show{
    opacity:1;

    pointer-events:auto;
}

   RESPONSIVE

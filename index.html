/* =========================================================
   IMOLE 2027 — COMPLETE HOMEPAGE
   GITHUB PAGES EDITION
========================================================= */

:root {
    --navy: #031a3b;
    --navy2: #061f4d;
    --blue: #0754a6;
    --blue2: #0a72cf;
    --gold: #f7b900;
    --gold2: #ffd84d;
    --white: #ffffff;
    --black: #111111;
    --text: #26364d;
    --muted: #68778d;
    --light: #f4f7fb;
    --border: #e2e8f0;
    --green: #12a85a;
    --shadow: 0 18px 55px rgba(3,26,59,.13);
    --radius: 22px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    color: var(--text);
    background: var(--light);
    line-height: 1.6;
}

img {
    max-width: 100%;
    display: block;
}

a {
    text-decoration: none;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}


/* =========================================================
   TOP STRIP
========================================================= */

.top-strip {
    background: var(--navy);
    color: rgba(255,255,255,.85);
    font-size: 13px;
    padding: 8px 15px;
}

.top-strip-inner {
    max-width: 1250px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;
}

.top-strip strong {
    color: var(--gold2);
}


/* =========================================================
   HEADER
========================================================= */

.header {
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(255,216,77,.15),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            var(--navy),
            var(--blue)
        );

    color: white;
    padding: 22px 18px;
}

.header::before {
    content: "";

    position: absolute;

    width: 380px;
    height: 380px;

    border-radius: 50%;

    right: -160px;
    top: -250px;

    background:
        rgba(255,255,255,.05);
}

.header::after {
    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    left: -180px;
    bottom: -230px;

    background:
        rgba(255,216,77,.05);
}

.header-inner {
    position: relative;
    z-index: 2;

    max-width: 1250px;
    margin: auto;

    display: flex;
    align-items: center;

    gap: 18px;
}

.logo {
    width: 82px;
    height: 82px;

    border-radius: 50%;

    object-fit: contain;

    background: white;

    padding: 5px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

.header-text h1 {
    margin: 0;

    font-size: clamp(20px, 3vw, 31px);

    line-height: 1.15;

    font-weight: 950;

    letter-spacing: .3px;
}

.header-text p {
    margin: 4px 0;

    font-size: 14px;

    color:
        rgba(255,255,255,.87);
}

.header-badge {
    display: inline-block;

    margin-top: 7px;

    padding: 5px 13px;

    border-radius: 30px;

    background: var(--gold);

    color: #111;

    font-size: 12px;

    font-weight: 900;
}


/* =========================================================
   MOBILE MENU BUTTON
========================================================= */

.mobile-menu-button {
    display: none;

    width: 100%;

    border: 0;

    background: var(--navy2);

    color: white;

    padding: 15px;

    font-size: 16px;

    font-weight: 900;
}


/* =========================================================
   MAIN NAVIGATION
========================================================= */

.main-nav {
    position: sticky;

    top: 0;

    z-index: 9999;

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 4px;

    padding: 8px 10px;

    background:

        0 5px 20px rgba(0,0,0,.07);

    font-weight: 850;

    padding: 10px 12px;

    border-radius: 9px;

    transition: .2s ease;
}

.main-nav a:hover {
    background: var(--blue);

    color: white;

    transform:
        translateY(-1px);
}

.main-nav a.active {
    background: var(--blue);

    color: white;
}

.main-nav a.media-link {
    background:
        #eaf3ff;

    color:
        var(--blue);
}

.main-nav a.media-link:hover {
    background:
        var(--blue);

    color:
        white;
}

.main-nav a.donate-link {
    background:
        var(--gold);

    color:
        #111;
}

.main-nav a.join-link {
    background:
        var(--navy);

    color:
        white;
}

========================================================= */

            rgba(247,185,0,.18),
            transparent 25%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(10,114,207,.25),

        linear-gradient(
            135deg,
            #021329,
            #06275d 50%,

}

.hero::before {
    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    right: -250px;
    bottom: -300px;

    border:
        1px solid
        rgba(255,255,255,.08);
}

.hero-inner {
    position: relative;

    z-index: 2;

    max-width: 1250px;

    margin: auto;

    width: 100%;

    display: grid;

    grid-template-columns:
        1.15fr

    align-items: center;

    gap: 50px;

.hero-content {

}

    align-items: center;

    padding: 8px 15px;

    border:

    color:

    font-size: 13px;

    font-weight: 900;

    letter-spacing: 1.5px;
}

.hero h2 {
    margin:

    font-size:

    line-height: .98;

    letter-spacing: -3px;

    font-weight: 950;
}

.hero h2 span {
    color: var(--gold2);
}

.hero-text {
    max-width: 690px;

    margin: 0;

    color:
        rgba(255,255,255,.86);

    font-size:
        clamp(16px, 2vw, 19px);
}

.hero-buttons {

}

}

    color:
        white;
}

========================================================= */

    color:

    font-weight:
        900;

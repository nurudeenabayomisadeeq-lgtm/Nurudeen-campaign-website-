<meta name="theme-color" content="#064a9b"><link rel="manifest" href="manifest.json"><style>
:root{
--navy:#031a3b;
--navy2:#061f4d;
--blue:#0754a6;
--blue2:#0a72cf;
--gold:#f7b900;
--gold2:#ffd84d;
--white:#fff;
--text:#26364d;
--muted:#68778d;
--light:#f4f7fb;
--border:#e2e8f0;
--green:#12a85a;
--shadow:0 18px 55px rgba(3,26,59,.13);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
color:var(--text);
background:var(--light);
line-height:1.6;
}

img{
max-width:100%;
display:block;
}

a{
text-decoration:none;
}

button,input{
font-family:inherit;
}

button{
cursor:pointer;
}

/* TOP STRIP */
.top-strip{
background:var(--navy);
color:rgba(255,255,255,.85);
font-size:13px;
padding:8px 15px;
}

.top-strip-inner{
max-width:1250px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.top-strip strong{
color:var(--gold2);
}

/* HEADER */
.header{
position:relative;
overflow:hidden;
background:
radial-gradient(circle at 90% 10%,rgba(255,216,77,.15),transparent 25%),
linear-gradient(135deg,var(--navy),var(--blue));
color:white;
padding:22px 18px;
}

.header-inner{
position:relative;
z-index:2;
max-width:1250px;
margin:auto;
display:flex;
align-items:center;
gap:18px;
}

.logo{
width:82px;
height:82px;
border-radius:50%;
object-fit:contain;
background:white;
padding:5px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.header-text h1{
margin:0;
font-size:clamp(20px,3vw,31px);
line-height:1.15;
font-weight:950;
}

.header-text p{
margin:4px 0;
font-size:14px;
color:rgba(255,255,255,.87);
}

.header-badge{
display:inline-block;
margin-top:7px;
padding:5px 13px;
border-radius:30px;
background:var(--gold);
color:#111;
font-size:12px;
font-weight:900;
}

/* MOBILE MENU BUTTON */
.mobile-menu-button{
display:none;
width:100%;
border:0;
background:var(--navy2);
color:white;
padding:15px;
font-size:16px;
font-weight:900;
}

/* NAVIGATION */
.main-nav{
position:sticky;
top:0;
z-index:9999;
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:4px;
padding:8px 10px;
background:rgba(255,255,255,.97);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--border);
box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.main-nav a{
color:var(--navy);
font-size:13px;
font-weight:850;
padding:10px 12px;
border-radius:9px;
transition:.2s ease;
}

.main-nav a:hover{
background:var(--blue);
color:white;
transform:translateY(-1px);
}

.main-nav a.media-link{
background:#eaf3ff;
color:var(--blue);
font-weight:950;
}

.main-nav a.donate-link{
background:var(--gold);
color:#111;
}

.main-nav a.join-link{
background:var(--navy);
color:white;
}

/* HERO */
.hero{
position:relative;
overflow:hidden;
min-height:650px;
display:flex;
align-items:center;
padding:90px 20px 100px;
color:white;
background:
radial-gradient(circle at 80% 20%,rgba(247,185,0,.18),transparent 25%),
radial-gradient(circle at 10% 90%,rgba(10,114,207,.25),transparent 30%),
linear-gradient(135deg,#021329,#06275d 50%,#0754a6);
}

.hero-inner{
position:relative;
z-index:2;
max-width:1250px;
margin:auto;
width:100%;
display:grid;
grid-template-columns:1.15fr .85fr;
align-items:center;
gap:50px;
}

.hero-content{
max-width:760px;
}

.hero-kicker{
display:inline-flex;
align-items:center;
gap:8px;
padding:8px 15px;
border-radius:30px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.18);
color:var(--gold2);
font-size:13px;
font-weight:900;
letter-spacing:1.5px;
}

.hero h2{
margin:22px 0 16px;
font-size:clamp(46px,7vw,82px);
line-height:.98;
letter-spacing:-3px;
font-weight:950;
}

.hero h2 span{
color:var(--gold2);
}

.hero-text{
max-width:690px;
margin:0;
color:rgba(255,255,255,.86);
font-size:clamp(16px,2vw,19px);
}

.hero-buttons{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:30px;
}

.hero-button{
display:inline-flex;
justify-content:center;
align-items:center;
gap:7px;
padding:14px 20px;
border-radius:11px;
font-weight:900;
transition:.25s ease;
}

.hero-button:hover{
transform:translateY(-3px);
}

.hero-button.gold{
background:var(--gold);
color:#111;
}

.hero-button.white{
background:white;
color:var(--navy);
}

.hero-button.outline{
border:2px solid rgba(255,255,255,.4);
color:white;
}

/* HERO CARD */
.hero-card{
background:rgba(255,255,255,.09);
border:1px solid rgba(255,255,255,.18);
border-radius:28px;
padding:18px;
box-shadow:0 25px 70px rgba(0,0,0,.25);
backdrop-filter:blur(10px);
}

.hero-card-image{
width:100%;
aspect-ratio:4/5;
object-fit:cover;
border-radius:20px;
}

.hero-card-bottom{
padding:18px 8px 5px;
}

.hero-card-bottom strong{
display:block;
font-size:19px;
color:white;
}

.hero-card-bottom span{
display:block;
margin-top:3px;
color:rgba(255,255,255,.72);
font-size:13px;
}

.hero-card-badge{
display:inline-block;
margin-top:10px;
background:var(--gold);
color:#111;
border-radius:30px;
padding:5px 12px;
font-size:11px;
font-weight:900;
}

/* STATS */
.quick-stats{
margin-top:-55px;
position:relative;
z-index:10;
padding:0 20px;
}

.stats-grid{
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
background:white;
border-radius:20px;
box-shadow:0 20px 55px rgba(3,26,59,.15);
overflow:hidden;
}

.stat{
padding:25px 15px;
text-align:center;
border-right:1px solid var(--border);
}

.stat:last-child{
border-right:0;
}

.stat strong{
display:block;
color:var(--blue);
font-size:29px;
font-weight:950;
}

.stat span{
display:block;
color:var(--muted);
font-size:13px;
font-weight:700;
}

/* GENERAL */
.section{
padding:85px 20px;
}

.section-white{
background:white;
}

.container{
max-width:1200px;
margin:auto;
}

.section-heading{
max-width:780px;
margin:0 auto 45px;
text-align:center;
}

.eyebrow{
color:var(--blue);
font-size:13px;
font-weight:950;
letter-spacing:2px;
text-transform:uppercase;
}

.section-heading h2{
margin:9px 0 12px;
color:var(--navy);
font-size:clamp(29px,4vw,42px);
line-height:1.15;
font-weight:950;
}

.section-heading p{
margin:0;
color:var(--muted);
font-size:16px;
}

/* ABOUT */
.about-grid{
display:grid;
grid-template-columns:.95fr 1.05fr;
gap:55px;
align-items:center;
}

.about-image img{
width:100%;
max-height:520px;
object-fit:cover;
border-radius:26px;
box-shadow:var(--shadow);
}

.about-content h2{
margin:0 0 15px;
color:var(--navy);
font-size:37px;
line-height:1.15;
}

.about-content p{
color:var(--muted);
margin:0 0 15px;
}

.values{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:25px;
}

.value{
padding:17px;
border:1px solid var(--border);
background:#f8fbff;
border-radius:14px;
}

.value strong{
display:block;
color:var(--navy);
margin-bottom:4px;
}

.value span{
color:var(--muted);
font-size:13px;
}

/* MANIFESTO */
.manifesto-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.manifesto-card{
background:white;
border:1px solid var(--border);
border-radius:20px;
padding:28px 22px;
box-shadow:0 8px 28px rgba(3,26,59,.06);
transition:.25s ease;
}

.manifesto-card:hover{
transform:translateY(-6px);
box-shadow:var(--shadow);
}

.manifesto-icon{
width:58px;
height:58px;
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
background:#eaf3ff;
font-size:27px;
margin-bottom:18px;
}

.manifesto-card h3{
margin:0 0 8px;
color:var(--navy);
font-size:20px;
}

.manifesto-card p{
margin:0;
color:var(--muted);
font-size:14px;
}

/* MEDIA */
.media-feature{
background:linear-gradient(135deg,#031329,#064a9b);
color:white;
}

.media-feature .section-heading h2{
color:white;
}

.media-feature .section-heading p{
color:rgba(255,255,255,.72);
}

.media-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.media-card{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.14);
border-radius:20px;
overflow:hidden;
transition:.25s ease;
}

.media-card:hover{
transform:translateY(-6px);
background:rgba(255,255,255,.12);
}

.media-card-icon{
height:170px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#08285b,#0754a6);
font-size:70px;
}

.media-card-content{
padding:21px;
}

.media-card-content h3{
margin:0 0 7px;
color:white;
font-size:20px;
}

.media-card-content p{
margin:0;
color:rgba(255,255,255,.68);
font-size:14px;
}

.media-card-button{
display:inline-block;
margin-top:15px;
padding:11px 17px;
border-radius:9px;
background:var(--gold);
color:#111;
font-size:13px;
font-weight:900;
}

/* AREAS */
.area-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:14px;
}

.area{
text-align:center;
background:white;
border:1px solid var(--border);
border-radius:17px;
padding:23px 10px;
transition:.2s ease;
}

.area:hover{
border-color:var(--blue);
transform:translateY(-4px);
}

.area-icon{
font-size:25px;
}

.area strong{
display:block;
color:var(--navy);
margin-top:8px;
font-size:14px;
}

/* COUNTDOWN */
.countdown-section{
padding:75px 20px;
background:linear-gradient(135deg,#f8fbff,#eaf3ff);
}

.countdown-box{
max-width:1000px;
margin:auto;
background:white;
border:1px solid var(--border);
border-radius:25px;
padding:35px 25px;
box-shadow:var(--shadow);
text-align:center;
}

.countdown-box h2{
margin:0 0 8px;
color:var(--navy);
font-size:31px;
}

.countdown-box p{
color:var(--muted);
margin:0 0 25px;
}

.countdown{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
max-width:700px;
margin:auto;
}

.time-box{
background:var(--navy);
color:white;
border-radius:15px;
padding:17px 10px;
}

.time-box strong{
display:block;
color:var(--gold2);
font-size:31px;
line-height:1;
}

.time-box span{
font-size:11px;
text-transform:uppercase;
letter-spacing:1px;
opacity:.8;
}

/* ACTIONS */
.action-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.action-card{
padding:30px 24px;
border-radius:20px;
background:white;
border:1px solid var(--border);
text-align:center;
box-shadow:0 8px 28px rgba(3,26,59,.06);
}

.action-card-icon{
font-size:36px;
margin-bottom:10px;
}

.action-card h3{
margin:0 0 8px;
color:var(--navy);
}

.action-card p{
margin:0 0 18px;
color:var(--muted);
font-size:14px;
}

.action-card a{
display:inline-block;
padding:11px 17px;
border-radius:9px;
background:var(--blue);
color:white;
font-weight:900;
font-size:13px;
}

/* CTA */
.big-cta{
padding:90px 20px;
color:white;
text-align:center;
background:
radial-gradient(circle at 50% 0%,rgba(247,185,0,.15),transparent 35%),
linear-gradient(135deg,#031329,#0754a6);
}

.big-cta-inner{
max-width:850px;
margin:auto;
}

.big-cta h2{
margin:0 0 12px;
font-size:clamp(32px,5vw,48px);
line-height:1.1;
}

.big-cta p{
margin:0;
color:rgba(255,255,255,.8);
font-size:17px;
}

.cta-buttons{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px;
margin-top:28px;
}

.cta-button{
padding:14px 21px;
border-radius:10px;
font-weight:900;
}

.cta-button.gold{
background:var(--gold);
color:#111;
}

.cta-button.white{
background:white;
color:var(--navy);
}

/* FOOTER */
footer{
background:#020f25;
color:rgba(255,255,255,.68);
text-align:center;
padding:45px 20px;
}

.footer-brand{
color:white;
font-size:18px;
font-weight:950;
}

.footer-slogan{
color:var(--gold2);
font-weight:900;
}

.footer-links{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:7px 18px;
margin:20px 0;
}

.footer-links a{
color:rgba(255,255,255,.75);
font-size:13px;
}

.footer-links a:hover{
color:var(--gold2);
}

/* BACK TOP */
.back-top{
position:fixed;
right:18px;
bottom:18px;
width:50px;
height:50px;
border:0;
border-radius:50%;
background:var(--gold);
color:#111;
font-size:22px;
font-weight:900;
display:none;
z-index:10000;
box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.back-top.show{
display:block;
}

/* MOBILE */
@media(max-width:950px){

.hero-inner{
grid-template-columns:1fr;
}

.hero-content{
text-align:center;
margin:auto;
}

.hero-buttons{
justify-content:center;
}

.hero-card{
max-width:480px;
margin:auto;
}

.manifesto-grid,
.media-grid{
grid-template-columns:repeat(2,1fr);
}

.area-grid{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:700px){

.top-strip-inner{
justify-content:center;
text-align:center;
}

.top-strip-inner span:last-child{
display:none;
}

.header-inner{
flex-direction:column;
text-align:center;
}

.mobile-menu-button{
display:block;
}

.main-nav{
display:none;
position:relative;
flex-direction:column;
align-items:stretch;
padding:10px;
}

.main-nav.show{
display:flex;
}

.main-nav a{
width:100%;
text-align:center;
padding:14px;
font-size:15px;
border-bottom:1px solid #edf0f4;
}

.hero{
min-height:auto;
padding:70px 16px 85px;
}

.hero h2{
font-size:46px;
letter-spacing:-2px;
}

.hero-text{
font-size:15px;
}

.hero-buttons{
flex-direction:column;
}

.hero-button{
width:100%;
}

.quick-stats{
margin-top:-35px;
padding:0 12px;
}

.stats-grid{
grid-template-columns:repeat(2,1fr);
}

.stat:nth-child(2){
border-right:0;
}

.stat:nth-child(1),
.stat:nth-child(2){
border-bottom:1px solid var(--border);
}

.section{
padding:60px 15px;
}

.about-grid{
grid-template-columns:1fr;
gap:30px;
}

.about-content h2{
font-size:30px;
}

.values{
grid-template-columns:1fr;
}

.manifesto-grid,
.media-grid{
grid-template-columns:1fr;
}

.area-grid{
grid-template-columns:repeat(2,1fr);
}

.countdown{
grid-template-columns:repeat(2,1fr);
}

.action-grid{
grid-template-columns:1fr;
}

.big-cta{
padding:70px 15px;
}

}

@media(max-width:380px){

.hero h2{
font-size:39px;
}

.stats-grid{
grid-template-columns:1fr;
}

.stat{
border-right:0!important;
border-bottom:1px solid var(--border);
}

.stat:last-child{
border-bottom:0;
}

}

:focus-visible{
outline:3px solid var(--gold);
outline-offset:3px;
}

<script>

/* MOBILE MENU */
const menuButton = document.getElementById("menuButton");
const mainNav = document.getElementById("mainNav");

if(menuButton && mainNav){

menuButton.addEventListener("click",function(){

const isOpen = mainNav.classList.toggle("show");

menuButton.setAttribute(
"aria-expanded",
isOpen ? "true" : "false"
);

menuButton.textContent =
isOpen ? "✕ CLOSE MENU" : "☰ MENU";

});

mainNav.querySelectorAll("a").forEach(function(link){

link.addEventListener("click",function(){

mainNav.classList.remove("show");

menuButton.setAttribute(
"aria-expanded",
"false"
);

menuButton.textContent="☰ MENU";

});

});

}

/* COUNTDOWN */
function updateCountdown(){

const electionDate = new Date("2027-03-06T08:00:00+01:00").getTime();

const now = new Date().getTime();

const difference = electionDate - now;

if(difference <= 0){

document.getElementById("days").textContent="0";
document.getElementById("hours").textContent="0";
document.getElementById("minutes").textContent="0";
document.getElementById("seconds").textContent="0";

return;

}

const days = Math.floor(
difference / (1000 * 60 * 60 * 24)
);

const hours = Math.floor(
(difference % (1000 * 60 * 60 * 24)) /
(1000 * 60 * 60)
);

const minutes = Math.floor(
(difference % (1000 * 60 * 60)) /
(1000 * 60)
);

const seconds = Math.floor(
(difference % (1000 * 60)) /
1000
);

document.getElementById("days").textContent=days;
document.getElementById("hours").textContent=hours;
document.getElementById("minutes").textContent=minutes;
document.getElementById("seconds").textContent=seconds;

}

updateCountdown();

setInterval(updateCountdown,1000);

/* BACK TO TOP */
const backTop=document.getElementById("backTop");

window.addEventListener("scroll",function(){

if(window.scrollY>500){

backTop.classList.add("show");

}else{

backTop.classList.remove("show");

}

});

backTop.addEventListener("click",function(){

window.scrollTo({
top:0,
behavior:"smooth"
});

});

</script></body>

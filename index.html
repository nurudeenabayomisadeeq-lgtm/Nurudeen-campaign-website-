     JAVASCRIPT
============================== --><script>

    /* ==============================
       ELECTION COUNTDOWN
    ============================== */

    const electionDate =
        new Date("2027-02-06T08:00:00+01:00").getTime();


    function updateCountdown() {

        const now =
            new Date().getTime();

        const distance =
            electionDate - now;


        if (distance <= 0) {

            document.getElementById("days").textContent = "0";
            document.getElementById("hours").textContent = "0";
            document.getElementById("minutes").textContent = "0";
            document.getElementById("seconds").textContent = "0";

            return;
        }


        const days =
            Math.floor(
                distance /
                (1000 * 60 * 60 * 24)
            );


        const hours =
            Math.floor(
                (distance %
                    (1000 * 60 * 60 * 24)) /
                (1000 * 60 * 60)
            );


        const minutes =
            Math.floor(
                (distance %
                    (1000 * 60 * 60)) /
                (1000 * 60)
            );


        const seconds =
            Math.floor(
                (distance %
                    (1000 * 60)) /
                1000
            );


        document.getElementById("days").textContent =
            days;

        document.getElementById("hours").textContent =
            hours;

        document.getElementById("minutes").textContent =
            minutes;

        document.getElementById("seconds").textContent =
            seconds;

    }


    updateCountdown();

    setInterval(
        updateCountdown,
        1000
    );


    /* ==============================
       MOBILE MENU
    ============================== */

    function toggleMenu() {

        const menu =
            document.getElementById("mainMenu");

        const button =
            document.getElementById("menuButton");


        menu.classList.toggle("show");


        const isOpen =
            menu.classList.contains("show");


        button.setAttribute(
            "aria-expanded",
            isOpen
        );

    }


    /* ==============================
       CLOSE MOBILE MENU AFTER CLICK
    ============================== */

    document
        .querySelectorAll(".main-nav a")
        .forEach(function(link) {

            link.addEventListener(
                "click",
                function() {

                    const menu =
                        document.getElementById("mainMenu");

                    const button =
                        document.getElementById("menuButton");


                    menu.classList.remove("show");

                    button.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }
            );

        });

</script></body>

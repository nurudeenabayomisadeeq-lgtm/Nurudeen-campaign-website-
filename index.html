<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>IMOLE 2027 | Hon. Nurudeen Abayomi Sadeeq</title><meta name="description"
content="Official IMOLE 2027 campaign website of Hon. Nurudeen Abayomi Sadeeq for Lagos State House of Assembly, Ojo Constituency II, under the Nigeria Democratic Congress (NDC).">

<meta name="keywords"
content="IMOLE 2027, Nurudeen Abayomi Sadeeq, Ojo Constituency II, NDC, Lagos State House of Assembly">

<meta name="author" content="Hon. Nurudeen Abayomi Sadeeq Campaign"><meta name="theme-color" content="#061a3a"><link rel="manifest" href="manifest.json?v=20260829"><style>
:root{
    --navy:#03152f;
    --navy2:#061f45;
    --blue:#0757ad;
    --blue2:#0878d1;
    --gold:#f6b900;
    --gold2:#ffd84d;
    --green:#0ca65a;
    --white:#ffffff;
    --text:#25364d;
    --muted:#6b7b90;
    --light:#f4f7fb;
    --border:#e3e9f1;
    --shadow:0 20px 60px rgba(3,21,47,.14);
    --radius:22px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--light);
    color:var(--text);
    line-height:1.6;
}

img{
    max-width:100%;
    display:block;
}

a{
    text-decoration:none;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   TOP BAR
========================= */

.top-bar{
    background:var(--navy);
    color:rgba(255,255,255,.82);
    padding:8px 16px;
    font-size:12px;
}

.top-bar-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.top-bar strong{
    color:var(--gold2);
}

/* =========================
   HEADER
========================= */

.header{
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 90% 15%,rgba(255,216,77,.16),transparent 25%),
        radial-gradient(circle at 10% 100%,rgba(8,120,209,.2),transparent 30%),
        linear-gradient(135deg,#02122b,#0757ad);
    color:white;
    padding:20px 18px;
}

.header-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:18px;
}

.logo-wrap{
    width:82px;
    height:82px;
    flex:none;
    border-radius:50%;
    background:white;
    padding:5px;
    box-shadow:0 12px 35px rgba(0,0,0,.28);
    overflow:hidden;
}

.logo{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:50%;
}

.header-text h1{
    margin:0;
    font-size:clamp(20px,3vw,32px);
    line-height:1.1;
    font-weight:900;
}

.header-text p{
    margin:5px 0 0;
    font-size:14px;
    color:rgba(255,255,255,.82);
}

.badge{
    display:inline-block;
    margin-top:8px;
    padding:5px 13px;
    border-radius:30px;
    background:var(--gold);
    color:#111;
    font-size:11px;
    font-weight:900;
    letter-spacing:.5px;
}

/* =========================
   NAVIGATION
========================= */

.menu-button{
    display:none;
    width:100%;
    border:0;
    padding:15px;
    background:var(--navy2);
    color:white;
    font-weight:900;
    font-size:15px;
}

.main-nav{
    position:sticky;
    top:0;
    z-index:9999;
    background:rgba(255,255,255,.97);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    box-shadow:0 5px 25px rgba(0,0,0,.07);

    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
    padding:8px 10px;
}

.main-nav a{
    color:var(--navy);
    padding:10px 12px;
    border-radius:9px;
    font-size:12px;
    font-weight:900;
    transition:.2s ease;
}

.main-nav a:hover{
    background:var(--blue);
    color:white;
    transform:translateY(-1px);
}

.main-nav .media{
    background:#eaf3ff;
    color:var(--blue);
}

.main-nav .join{
    background:var(--navy);
    color:white;
}

.main-nav .support{
    background:var(--gold);
    color:#111;
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;
    overflow:hidden;
    min-height:690px;
    display:flex;
    align-items:center;
    padding:85px 20px 105px;
    color:white;

    background:
        radial-gradient(circle at 80% 15%,rgba(246,185,0,.2),transparent 25%),
        radial-gradient(circle at 15% 85%,rgba(8,120,209,.28),transparent 30%),
        linear-gradient(135deg,#020e21 0%,#052c63 55%,#0757ad 100%);
}

.hero::before{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    border:1px solid rgba(255,255,255,.06);
    border-radius:50%;
    right:-180px;
    top:-180px;
}

.hero-inner{
    width:100%;
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:1.15fr .85fr;
    align-items:center;
    gap:60px;
}

.hero-content{
    max-width:760px;
}

.hero-kicker{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 15px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);
    border-radius:30px;
    color:var(--gold2);
    font-size:12px;
    font-weight:900;
    letter-spacing:1.5px;
}

.hero h2{
    margin:20px 0 18px;
    font-size:clamp(45px,7vw,82px);
    line-height:.98;
    letter-spacing:-3px;
    font-weight:950;
}

.hero h2 span{
    color:var(--gold2);
}

.hero-description{
    max-width:700px;
    margin:0;
    color:rgba(255,255,255,.84);
    font-size:clamp(16px,2vw,19px);
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:48px;
    padding:13px 20px;
    border-radius:11px;
    font-weight:900;
    transition:.25s ease;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn-gold{
    background:var(--gold);
    color:#111;
}

.btn-white{
    background:white;
    color:var(--navy);
}

.btn-outline{
    color:white;
    border:1px solid rgba(255,255,255,.45);
    background:rgba(255,255,255,.04);
}

/* =========================
   CANDIDATE CARD
========================= */

.candidate-card{
    max-width:470px;
    width:100%;
    margin:auto;
    padding:15px;
    border-radius:28px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 30px 80px rgba(0,0,0,.3);
    backdrop-filter:blur(12px);
}

.candidate-photo{
    position:relative;
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    border-radius:21px;
    background:
        linear-gradient(135deg,#092d61,#0757ad);
}

.candidate-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photo-fallback{
    display:none;
    width:100%;
    height:100%;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    color:white;
    background:
        radial-gradient(circle at 50% 25%,rgba(255,216,77,.2),transparent 30%),
        linear-gradient(135deg,#03152f,#0757ad);
}

.photo-fallback strong{
    display:block;
    font-size:24px;
}

.photo-fallback span{
    display:block;
    margin-top:7px;
    color:rgba(255,255,255,.7);
    font-size:13px;
}

.candidate-info{
    padding:18px 7px 5px;
}

.candidate-info strong{
    display:block;
    color:white;
    font-size:20px;
}

.candidate-info span{
    display:block;
    margin-top:3px;
    color:rgba(255,255,255,.7);
    font-size:13px;
}

.candidate-party{
    display:inline-block;
    margin-top:10px;
    padding:5px 12px;
    background:var(--gold);
    color:#111;
    border-radius:30px;
    font-size:10px;
    font-weight:900;
}

/* =========================
   QUICK STATS
========================= */

.stats{
    position:relative;
    z-index:10;
    margin-top:-55px;
    padding:0 20px;
}

.stats-grid{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:white;
    border-radius:22px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

.stat{
    padding:25px 15px;
    text-align:center;
    border-right:1px solid var(--border);
}

.stat:last-child{
    border-right:0;
}

.stat strong{
    display:block;
    color:var(--blue);
    font-size:27px;
    font-weight:950;
}

.stat span{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

/* =========================
   GENERAL SECTIONS
========================= */

.section{
    padding:85px 20px;
}

.white-section{
    background:white;
}

.container{
    max-width:1200px;
    margin:auto;
}

.section-heading{
    max-width:780px;
    margin:0 auto 45px;
    text-align:center;
}

.eyebrow{
    color:var(--blue);
    font-size:12px;
    font-weight:950;
    letter-spacing:2px;
    text-transform:uppercase;
}

.section-heading h2{
    margin:9px 0 12px;
    color:var(--navy);
    font-size:clamp(29px,4vw,43px);
    line-height:1.12;
    font-weight:950;
}

.section-heading p{
    margin:0;
    color:var(--muted);
}

/* =========================
   ABOUT
========================= */

.about-grid{
    display:grid;
    grid-template-columns:.9fr 1.1fr;
    align-items:center;
    gap:55px;
}

.about-photo{
    border-radius:25px;
    overflow:hidden;
    box-shadow:var(--shadow);
    background:#eaf3ff;
}

.about-photo img{
    width:100%;
    min-height:480px;
    object-fit:cover;
}

.about-content h2{
    margin:0 0 15px;
    color:var(--navy);
    font-size:37px;
    line-height:1.15;
}

.about-content p{
    color:var(--muted);
    margin:0 0 15px;
}

.values{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:25px;
}

.value{
    padding:17px;
    border:1px solid var(--border);
    border-radius:15px;
    background:#f8fbff;
}

.value strong{
    display:block;
    color:var(--navy);
}

.value span{
    display:block;
    margin-top:4px;
    color:var(--muted);
    font-size:13px;
}

/* =========================
   MANIFESTO
========================= */

.manifesto-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.manifesto-card{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:27px 22px;
    box-shadow:0 8px 28px rgba(3,26,59,.06);
    transition:.25s ease;
}

.manifesto-card:hover{
    transform:translateY(-6px);
    box-shadow:var(--shadow);
}

.icon-box{
    width:57px;
    height:57px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    background:#eaf3ff;
    font-size:27px;
    margin-bottom:17px;
}

.manifesto-card h3{
    margin:0 0 8px;
    color:var(--navy);
}

.manifesto-card p{
    margin:0;
    color:var(--muted);
    font-size:14px;
}

/* =========================
   SIX WARDS
========================= */

.wards-section{
    background:
        radial-gradient(circle at 10% 10%,rgba(8,120,209,.08),transparent 25%),
        #f4f8fd;
}

.wards-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.ward{
    position:relative;
    padding:25px 20px;
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 8px 25px rgba(3,26,59,.05);
    transition:.25s ease;
    overflow:hidden;
}

.ward:hover{
    transform:translateY(-5px);
    border-color:var(--blue2);
    box-shadow:var(--shadow);
}

.ward-number{
    position:absolute;
    right:15px;
    top:8px;
    color:#edf3fa;
    font-size:58px;
    font-weight:950;
    line-height:1;
}

.ward-icon{
    position:relative;
    z-index:2;
    width:52px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eaf3ff;
    border-radius:15px;
    font-size:24px;
}

.ward h3{
    position:relative;
    z-index:2;
    margin:16px 0 5px;
    color:var(--navy);
    font-size:19px;
}

.ward p{
    position:relative;
    z-index:2;
    margin:0;
    color:var(--muted);
    font-size:13px;
}

/* =========================
   MEDIA
========================= */

.media-section{
    color:white;
    background:
        radial-gradient(circle at 85% 10%,rgba(246,185,0,.15),transparent 25%),
        linear-gradient(135deg,#031329,#0757ad);
}

.media-section .section-heading h2{
    color:white;
}

.media-section .section-heading p{
    color:rgba(255,255,255,.72);
}

.media-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.media-card{
    overflow:hidden;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.07);
    transition:.25s ease;
}

.media-card:hover{
    transform:translateY(-6px);
    background:rgba(255,255,255,.11);
}

.media-icon{
    height:165px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:68px;
    background:linear-gradient(135deg,#092b60,#0757ad);
}

.media-content{
    padding:21px;
}

.media-content h3{
    margin:0 0 7px;
    color:white;
}

.media-content p{
    margin:0;
    color:rgba(255,255,255,.68);
    font-size:14px;
}

.media-button{
    display:inline-block;
    margin-top:15px;
    padding:10px 16px;
    border-radius:9px;
    background:var(--gold);
    color:#111;
    font-size:12px;
    font-weight:900;
}

/* =========================
   COUNTDOWN
========================= */

.countdown-section{
    padding:75px 20px;
    background:linear-gradient(135deg,#f8fbff,#eaf3ff);
}

.countdown-box{
    max-width:1000px;
    margin:auto;
    padding:35px 25px;
    text-align:center;
    background:white;
    border:1px solid var(--border);
    border-radius:25px;
    box-shadow:var(--shadow);
}

.countdown-box h2{
    margin:0 0 8px;
    color:var(--navy);
    font-size:31px;
}

.countdown-box p{
    margin:0 0 25px;
    color:var(--muted);
}

.countdown{
    max-width:700px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.time-box{
    padding:17px 10px;
    border-radius:15px;
    background:var(--navy);
    color:white;
}

.time-box strong{
    display:block;
    color:var(--gold2);
    font-size:30px;
    line-height:1;
}

.time-box span{
    display:block;
    margin-top:7px;
    opacity:.8;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

/* =========================
   ACTIONS
========================= */

.action-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.action-card{
    padding:30px 23px;
    text-align:center;
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 8px 28px rgba(3,26,59,.06);
}

.action-icon{
    font-size:37px;
    margin-bottom:10px;
}

.action-card h3{
    margin:0 0 8px;
    color:var(--navy);
}

.action-card p{
    margin:0 0 18px;
    color:var(--muted);
    font-size:14px;
}

.action-card a{
    display:inline-block;
    padding:11px 17px;
    border-radius:9px;
    background:var(--blue);
    color:white;
    font-size:13px;
    font-weight:900;
}

/* =========================
   CTA
========================= */

.cta{
    padding:90px 20px;
    text-align:center;
    color:white;
    background:
        radial-gradient(circle at 50% 0%,rgba(246,185,0,.18),transparent 35%),
        linear-gradient(135deg,#031329,#0757ad);
}

.cta-inner{
    max-width:850px;
    margin:auto;
}

.cta h2{
    margin:0 0 12px;
    font-size:clamp(34px,5vw,52px);
    line-height:1.1;
}

.cta p{
    margin:0;
    color:rgba(255,255,255,.8);
    font-size:17px;
}

.cta-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:28px;
}

/* =========================
   FOOTER
========================= */

footer{
    padding:45px 20px;
    text-align:center;
    background:#020d20;
    color:rgba(255,255,255,.65);
}

.footer-name{
    color:white;
    font-size:19px;
    font-weight:950;
}

.footer-slogan{
    margin-top:3px;
    color:var(--gold2);
    font-weight:900;
}

.footer-links{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px 18px;
    margin:20px 0;
}

.footer-links a{
    color:rgba(255,255,255,.72);
    font-size:12px;
}

.footer-links a:hover{
    color:var(--gold2);
}

footer p{
    margin:7px 0;
    font-size:12px;
}

/* =========================
   BACK TO TOP
========================= */

.back-top{
    position:fixed;
    right:17px;
    bottom:17px;
    z-index:10000;

    width:49px;
    height:49px;
    display:none;

    border:0;
    border-radius:50%;
    background:var(--gold);
    color:#111;
    font-size:21px;
    font-weight:900;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.back-top.show{
    display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:950px){

    .hero-inner{
        grid-template-columns:1fr;
    }

    .hero-content{
        text-align:center;
        margin:auto;
    }

    .hero-buttons{
        justify-content:center;
    }

    .candidate-card{
        max-width:470px;
    }

    .manifesto-grid,
    .media-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .wards-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .action-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){

    .top-bar-inner{
        justify-content:center;
        text-align:center;
    }

    .top-bar-inner span:last-child{
        display:none;
    }

    .header-inner{
        flex-direction:column;
        text-align:center;
    }

    .menu-button{
        display:block;
    }

    .main-nav{
        display:none;
        position:relative;
        flex-direction:column;
        align-items:stretch;
        padding:10px;
    }

    .main-nav.show{
        display:flex;
    }

    .main-nav a{
        width:100%;
        text-align:center;
        padding:14px;
        font-size:14px;
        border-bottom:1px solid #edf1f5;
    }

    .hero{
        min-height:auto;
        padding:65px 15px 85px;
    }

    .hero h2{
        font-size:45px;
        letter-spacing:-2px;
    }

    .hero-description{
        font-size:15px;
    }

    .hero-buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

    .stats{
        margin-top:-35px;
        padding:0 12px;
    }

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stat:nth-child(2){
        border-right:0;
    }

    .stat:nth-child(1),
    .stat:nth-child(2){
        border-bottom:1px solid var(--border);
    }

    .section{
        padding:60px 15px;
    }

    .about-grid{
        grid-template-columns:1fr;
        gap:30px;
    }

    .about-photo img{
        min-height:350px;
    }

    .about-content h2{
        font-size:30px;
    }

    .values{
        grid-template-columns:1fr;
    }

    .manifesto-grid,
    .media-grid{
        grid-template-columns:1fr;
    }

    .wards-grid{
        grid-template-columns:1fr;
    }

    .countdown{
        grid-template-columns:repeat(2,1fr);
    }

    .action-grid{
        grid-template-columns:1fr;
    }

    .cta{
        padding:70px 15px;
    }
}

@media(max-width:380px){

    .hero h2{
        font-size:38px;
    }

    .stats-grid{
        grid-template-columns:1fr;

/* ==========================================

const menuButton = document.getElementById("menuButton");
const mainNav = document.getElementById("mainNav");

if(menuButton && mainNav){

    menuButton.addEventListener("click", function(){

        const opened =
            mainNav.classList.toggle("show");

        menuButton.setAttribute(
            "aria-expanded",
            opened ? "true" : "false"
        );

        menuButton.textContent =
            opened ? "✕ CLOSE MENU" : "☰ MENU";

    });


    mainNav.querySelectorAll("a").forEach(function(link){

        link.addEventListener("click", function(){

            mainNav.classList.remove("show");

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            menuButton.textContent = "☰ MENU";

        });

    });

}


/* ==========================================
   IMAGE FALLBACK SYSTEM
   Tries multiple filenames automatically.
========================================== */

function tryImages(imageId, filenames, fallbackId){

    const image = document.getElementById(imageId);

    if(!image){
        return;
    }

    let position = 0;

    function loadNext(){

        if(position >= filenames.length){

            image.style.display = "none";

            if(fallbackId){

                const fallback =
                    document.getElementById(fallbackId);

                if(fallback){
                    fallback.style.display = "flex";
                }

            }

            return;
        }

        const filename = filenames[position++];

        image.src =
            filename + "?v=20260829-" + Date.now();

    }

    image.onerror = loadNext;

    image.onload = function(){

        image.style.display = "block";

        if(fallbackId){

            const fallback =
                document.getElementById(fallbackId);

            if(fallback){
                fallback.style.display = "none";
            }

        }

    };

    loadNext();
}


/*
   Candidate photo:
   The website will try these names in order.
*/

tryImages(
    "candidateHeroImage",
    [
        "assets/nurudeen.jpg",
        "assets/nurudeen.jpeg",
        "assets/nurudeen.png",
        "assets/candidate.jpg",
        "assets/candidate.jpeg",
        "assets/candidate.png",
        "assets/Nurudeen.jpg",
        "assets/Nurudeen.jpeg",
        "assets/Nurudeen.png"
    ],
    "heroPhotoFallback"
);


/*
   About section candidate photo.
*/

tryImages(
    "candidateAboutImage",
    [
        "assets/nurudeen.jpg",
        "assets/nurudeen.jpeg",
        "assets/nurudeen.png",
        "assets/candidate.jpg",
        "assets/candidate.jpeg",
        "assets/candidate.png",
        "assets/Nurudeen.jpg",
        "assets/Nurudeen.jpeg",
        "assets/Nurudeen.png"
    ]
);


/*
   NDC party logo.
*/

const partyLogo =
    document.getElementById("partyLogo");

if(partyLogo){

    const logoFiles = [
        "assets/ndc-logo.png",
        "assets/ndc-logo.jpg",
        "assets/ndc-logo.jpeg",
        "assets/ndc-logo.webp",
        "assets/NDC-logo.png",
        "assets/NDC-logo.jpg",
        "assets/NDC.png",
        "assets/ndc.png",
        "assets/ndc.jpg"
    ];

    let logoPosition = 0;

    function loadNextLogo(){

        if(logoPosition >= logoFiles.length){

            /*
               If no logo exists, keep the white logo
               container clean instead of showing a broken image.
            */

            partyLogo.style.display = "none";

            return;
        }

        partyLogo.src =
            logoFiles[logoPosition++] +
            "?v=20260829-" +
            Date.now();

    }

    partyLogo.onerror = loadNextLogo;

    loadNextLogo();
}


/* ==========================================
   COUNTDOWN
========================================== */

function updateCountdown(){

    /*
       Election countdown target.
       Local Lagos/Nigeria time is UTC+1.
    */

    const electionDate =
        new Date("2027-03-06T08:00:00+01:00").getTime();

    const now =
        new Date().getTime();

    const difference =
        electionDate - now;


    if(difference <= 0){

        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "0";
        document.getElementById("minutes").textContent = "0";
        document.getElementById("seconds").textContent = "0";

        return;
    }


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (difference %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (difference %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (difference %
            (1000 * 60)) /
            1000
        );


    document.getElementById("days").textContent =
        days;

    document.getElementById("hours").textContent =
        hours;

    document.getElementById("minutes").textContent =
        minutes;

    document.getElementById("seconds").textContent =
        seconds;
}


updateCountdown();

setInterval(
    updateCountdown,
    1000
);

if(backTop){

    window.addEventListener(

            if(window.scrollY > 500){

                backTop.classList.add("show");

            }else{

                backTop.classList.remove("show");

            }

        }
    );


    backTop.addEventListener(
        "click",
        function(){

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }
    );

}
